name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v1.4.2'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: pdf_editor ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            ## pdf_editor — fully offline

            Your PDFs stay on your computer. Nothing is uploaded or stored elsewhere.

            ### Installers
            - **Windows:** `pdf_editor_…_x64-setup.exe`
            - **macOS:** Apple Silicon + Intel `.dmg`
            - **Linux:** `.AppImage`

            (Plus small `.sig` / `latest.json` files for in-app updates — ignore those for manual install.)

            In-app updates: after installing this build, future versions install from the Update toast without a manual redownload.

            See the README for screenshots and features.
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # The matrix jobs above each upload their own latest.json and race each
  # other (last writer wins), leaving most platforms out of the updater
  # manifest. Rebuild a merged latest.json once ALL platforms are done.
  fixup-latest-json:
    needs: publish-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild and upload merged latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          gh release download "$TAG" --pattern '*.sig' --pattern 'latest.json' --clobber
          python3 - "$TAG" <<'PYEOF'
          import glob, json, os, sys

          tag = sys.argv[1]
          version = tag.lstrip('v')
          base = f'https://github.com/Salutatorian/the-pdf-editor/releases/download/{tag}'

          with open('latest.json') as f:
              d = json.load(f)
          d['platforms'] = {}

          def sig(path):
              with open(path) as f:
                  return f.read().strip()

          for path in sorted(glob.glob('*.sig')):
              name = path[:-4]  # strip .sig
              s = sig(path)
              if name.endswith('_x64-setup.exe'):
                  keys = ['windows-x86_64', 'windows-x86_64-nsis']
              elif name.endswith('_amd64.AppImage'):
                  keys = ['linux-x86_64', 'linux-x86_64-appimage']
              elif name.endswith('_aarch64.dmg') or name.endswith('_aarch64.app.tar.gz'):
                  keys = ['darwin-aarch64']
              elif name.endswith('_x64.dmg') or name.endswith('_x64.app.tar.gz'):
                  keys = ['darwin-x86_64']
              else:
                  continue
              for k in keys:
                  d['platforms'][k] = {'signature': s, 'url': f'{base}/{name}'}

          with open('latest.json', 'w') as f:
              json.dump(d, f, indent=2)
          print('platforms:', sorted(d['platforms'].keys()))
          PYEOF
          gh release upload "$TAG" latest.json --clobber
